<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ava — a native macOS browser on the Ladybird engine</title>
<meta name="description" content="A native macOS browser, built on the Ladybird engine.">
<meta name="theme-color" content="#F3F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1C1E" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Ava — a native macOS browser">
<meta property="og:description" content="Built on the Ladybird engine.">
<meta property="og:type" content="website">
<link rel="icon" href="ava-lift.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #F3F1EB;
    --ink: #242728;
    --muted: #6B6E67;
    --faint: #8A8D86;
    --tile: #FAF9F6;
    --line: rgba(36, 39, 40, .10);
    --btn-bg: #242728;
    --btn-ink: #F6F4EF;
    --shadow: 0 1px 2px rgba(36, 39, 40, .06), 0 12px 32px -12px rgba(36, 39, 40, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1C1E;
      --ink: #F3F1EB;
      --muted: #9BA097;
      --faint: #7C817A;
      --tile: #242728;
      --line: rgba(243, 241, 235, .10);
      --btn-bg: #F3F1EB;
      --btn-ink: #1B1C1E;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 32px -12px rgba(0, 0, 0, .55);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;                    /* single page, never scrolls */
    background: var(--bg);
    color: var(--ink);
    font: 400 clamp(14px, 1.05vw + 8px, 17px)/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    grid-template-columns: minmax(0, 1fr);
    padding: clamp(16px, 3.2vw, 40px) clamp(18px, 4vw, 48px);
  }

  main {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
  }

  .hero {
    width: 100%;
    min-width: 0;
    max-width: 30rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    gap: clamp(16px, 2.6vh, 28px);
    text-align: center;
  }

  .lockup {
    display: inline-flex;
    align-items: center;
    gap: clamp(12px, 1.6vw, 18px);
  }

  .mark {
    width: clamp(56px, 8vh, 92px);
    aspect-ratio: 1;
    border-radius: 23.5%;
    background: var(--tile);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: grid;
    place-items: center;
    flex: none;
  }
  .mark svg { width: 58%; height: 58%; display: block; }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 2.2vh + 2.2vw, 3rem);
    font-weight: 600;
    letter-spacing: -.035em;
    line-height: 1;
  }

  .lede {
    margin: 0;
    max-width: 24rem;
    font-size: clamp(1rem, 1.5vh + .4vw, 1.22rem);
    font-weight: 450;
    letter-spacing: -.014em;
    line-height: 1.42;
    color: var(--muted);
    text-wrap: pretty;
  }

  .links {
    display: grid;
    gap: clamp(12px, 1.8vh, 18px);
    justify-items: center;
    padding-top: clamp(2px, 1vh, 8px);
  }

  .primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 11px;
    background: var(--btn-bg);
    color: var(--btn-ink);
    font-size: .92rem;
    font-weight: 550;
    letter-spacing: -.008em;
    text-decoration: none;
    transition: transform 120ms ease-out, opacity 160ms ease-out;
  }
  .primary:hover { opacity: .9; }
  .primary:active { transform: scale(.975); }
  .primary svg { width: 15px; height: 15px; display: block; }

  .secondary {
    font-size: .88rem;
    color: var(--muted);
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 7px;
    transition: color 140ms ease-out, background-color 140ms ease-out;
  }
  .secondary:hover { color: var(--ink); background: var(--line); }

  footer {
    display: flex;
    justify-content: center;
    padding-top: clamp(8px, 1.6vh, 16px);
    border-top: 1px solid var(--line);
    font-size: .74rem;
    color: var(--faint);
    letter-spacing: .005em;
    text-align: center;
  }

  .hero > * { animation: rise 520ms cubic-bezier(.22, .8, .28, 1) backwards; }
  .hero > *:nth-child(1) { animation-delay: 40ms; }
  .hero > *:nth-child(2) { animation-delay: 100ms; }
  .hero > *:nth-child(3) { animation-delay: 160ms; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: none; }
  }

  @media (max-height: 480px) {
    .hero { gap: clamp(10px, 1.8vh, 14px); }
    .mark { width: clamp(40px, 6.5vh, 56px); }
  }
  @media (max-width: 360px) {
    .lockup { gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero > * { animation: none; }
    * { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div class="page">

  <main>
    <div class="hero">
      <div class="lockup">
        <div class="mark">
          <svg viewBox="0 0 300 300" role="img" aria-label="Ava">
            <path d="M61 230 C25 203 24 150 47 108 C74 58 122 33 174 42 C225 51 258 91 258 142 C258 180 242 213 212 238 C228 197 226 164 208 137 C190 110 163 99 135 109 C108 118 98 145 102 174 C106 202 96 225 79 232 Q69 237 61 230Z" fill="currentColor"/>
          </svg>
        </div>
        <h1>Ava</h1>
      </div>

      <p class="lede">A native macOS browser, built on the Ladybird engine.</p>

      <nav class="links">
        <a class="primary" href="https://github.com/Ava-Browser/ava">
          View the repository
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11l6-6M6 5h5v5"/></svg>
        </a>
        <a class="secondary" href="https://github.com/Ava-Browser/ava/tree/main/Documentation">Documentation</a>
      </nav>
    </div>
  </main>

  <footer>Early development — not a daily driver yet.</footer>

</div>
</body>
</html>
